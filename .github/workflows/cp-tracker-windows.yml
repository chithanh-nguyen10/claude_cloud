name: CP Tracker - Windows build

on:
  push:
    paths:
      - 'cp-tracker/**'
      - '.github/workflows/cp-tracker-windows.yml'
    tags:
      - 'cp-tracker-v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: cp-tracker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cp-tracker/src-tauri -> target

      - name: Install Tauri CLI
        run: npm ci

      - name: Build installer (NSIS .exe and .msi)
        run: npx tauri build

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi out/
          Copy-Item src-tauri/target/release/cp-tracker.exe out/CP-Tracker-portable.exe
          Get-ChildItem out

      - uses: actions/upload-artifact@v4
        with:
          name: CP-Tracker-Windows
          path: cp-tracker/out/*

      - name: Publish a release (only for tags cp-tracker-v*)
        if: startsWith(github.ref, 'refs/tags/cp-tracker-v')
        uses: softprops/action-gh-release@v2
        with:
          files: cp-tracker/out/*

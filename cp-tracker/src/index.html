<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CP Tracker</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="vendor/hl-light.css" id="hlLight">
<link rel="stylesheet" href="vendor/hl-dark.css" id="hlDark" disabled>
</head>
<body>
<div class="app">
  <!-- ================= sidebar ================= -->
  <aside class="side">
    <div class="brand"><img src="assets/icon.png" alt="" width="28" height="28">CP Tracker</div>
    <nav class="nav" id="nav"></nav>
    <div class="nav-head"><span data-i18n="nav.collections"></span><button class="icon-btn" id="addCol" data-i18n-title="col.add">+</button></div>
    <nav class="nav" id="colNav"></nav>
    <div class="grow"></div>
    <nav class="nav"><button data-view="settings" id="navSettings"><span class="ico">⚙</span><span data-i18n="nav.settings"></span></button></nav>
  </aside>

  <!-- ================= main ================= -->
  <main class="main">
    <div class="addbar">
      <input class="input add-input" id="addInput" spellcheck="false" autocomplete="off" data-i18n-ph="add.ph">
      <button class="btn primary" id="addBtn" data-i18n="add.btn"></button>
      <button class="btn" id="addManyBtn" data-i18n="add.many"></button>
    </div>
    <div class="viewhead">
      <div><h1 id="viewTitle"></h1><p class="hint" id="viewDesc"></p></div>
      <div class="grow"></div>
      <div class="row" id="viewActions"></div>
    </div>
    <div class="filters" id="filters">
      <input class="input" id="fSearch" data-i18n-ph="f.search" spellcheck="false">
      <select class="input" id="fPlatform"></select>
      <select class="input" id="fStatus"></select>
      <select class="input" id="fTag"></select>
      <select class="input" id="fSort"></select>
      <span class="hint" id="fCount"></span>
    </div>
    <div class="list" id="list"></div>
    <section class="settings" id="settings" hidden></section>
  </main>

  <!-- ================= detail ================= -->
  <aside class="detail" id="detail"></aside>
</div>

<div class="modal" id="manyModal" hidden>
  <div class="modal-box">
    <h3 data-i18n="many.title"></h3>
    <p class="hint" data-i18n="many.hint"></p>
    <textarea class="input mono" id="manyText" rows="10" spellcheck="false"></textarea>
    <div class="row">
      <label class="check"><input type="checkbox" id="manyQueue" checked> <span data-i18n="many.toQueue"></span></label>
      <div class="grow"></div>
      <button class="btn" id="manyCancel" data-i18n="common.cancel"></button>
      <button class="btn primary" id="manyOk" data-i18n="many.ok"></button>
    </div>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="vendor/marked.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="vendor/Sortable.min.js"></script>
<script src="js/platforms.js"></script>
<script src="js/store.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
